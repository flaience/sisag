
name: Build & Deploy (Swarm)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ==========================================================
      # BUILD E PUBLICAÇÃO DA IMAGEM
      # ==========================================================
      - name: Build & push APP image
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sisag:latest
            ghcr.io/${{ env.OWNER_LC }}/sisag:${{ github.sha }}

      # ==========================================================
      # DEPLOY NO DOCKER SWARM
      # ==========================================================
      - name: Deploy frontend to Swarm via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m

          script: |
            set -e

            SERVICE_NAME="sisag_app-frontend"
            EXPECTED_REPLICAS="2/2"
            IMAGE="ghcr.io/${{ env.OWNER_LC }}/sisag:latest"

            echo "Atualizando o serviço $SERVICE_NAME..."
            echo "Imagem: $IMAGE"

            docker service update \
              --detach \
              --with-registry-auth \
              --image "$IMAGE" \
              --force \
              "$SERVICE_NAME"

            echo "Atualização iniciada."
            echo "Aguardando convergência do frontend..."

            for attempt in $(seq 1 30); do
              REPLICAS=$(docker service ls \
                --filter "name=$SERVICE_NAME" \
                --format '{{.Replicas}}')

              UPDATE_STATE=$(docker service inspect "$SERVICE_NAME" \
                --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}unknown{{end}}')

              echo "Tentativa $attempt/30"
              echo "Réplicas: $REPLICAS"
              echo "Estado da atualização: $UPDATE_STATE"

              if [ "$REPLICAS" = "$EXPECTED_REPLICAS" ] && \
                 { [ "$UPDATE_STATE" = "completed" ] || [ "$UPDATE_STATE" = "unknown" ]; }; then
                echo "Frontend convergiu com sucesso."
                docker service ps "$SERVICE_NAME" --no-trunc
                exit 0
              fi

              if [ "$UPDATE_STATE" = "paused" ] || \
                 [ "$UPDATE_STATE" = "rollback_paused" ]; then
                echo "ERRO: atualização pausada pelo Docker Swarm."
                docker service ps "$SERVICE_NAME" --no-trunc
                docker service logs "$SERVICE_NAME" --tail 100 || true
                exit 1
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "ERRO: frontend não convergiu para $EXPECTED_REPLICAS dentro do prazo."
                docker service ps "$SERVICE_NAME" --no-trunc
                docker service logs "$SERVICE_NAME" --tail 100 || true
                exit 1
              fi

              sleep 10
            done

