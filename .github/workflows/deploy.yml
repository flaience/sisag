name: Build & Deploy Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debug (NÃO vaza segredos) – você PRECISA ver isso no log
      - name: Debug context (must show)
        run: |
          echo "actor=${{ github.actor }}"
          echo "owner=${{ github.repository_owner }}"
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "tag_latest=ghcr.io/${{ github.repository_owner }}/sisag:latest"
          echo "tag_sha=ghcr.io/${{ github.repository_owner }}/sisag:${{ github.sha }}"

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ LOGIN COM PAT (NÃO use GITHUB_TOKEN aqui)
      - name: Log in to GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags:
            |
              ghcr.io/${{ env.OWNER_LC }}/sisag:latest
              ghcr.io/${{ env.OWNER_LC }}/sisag:${{ github.sha }}
 
      - name: Deploy to Swarm via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ env.OWNER_LC }}/sisag:latest
            docker service update --with-registry-auth --image ghcr.io/${{ env.OWNER_LC }}/sisag:latest sisag_app-frontend
