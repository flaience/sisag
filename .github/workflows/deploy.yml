name: Build & Deploy (Swarm)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ==========================================================
      # BUILD E PUBLICAÇÃO DA IMAGEM
      # ==========================================================
      - name: Build & push APP image
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sisag:latest
            ghcr.io/${{ env.OWNER_LC }}/sisag:${{ github.sha }}

      # ==========================================================
      # DEPLOY NO DOCKER SWARM
      # ==========================================================
      - name: Deploy frontend to Swarm via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN

          script: |
            set -e

            SERVICE_NAME="sisag_app-frontend"
            EXPECTED_REPLICAS="2/2"
            IMAGE="ghcr.io/${{ env.OWNER_LC }}/sisag:${{ github.sha }}"
            MAX_ATTEMPTS=75
            RETRY_INTERVAL_SECONDS=10

            echo "Autenticando o nó do Swarm no GHCR..."
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            echo "Baixando e validando a imagem imutável..."
            docker pull "$IMAGE"
            docker image inspect "$IMAGE" >/dev/null

            echo "Atualizando o serviço $SERVICE_NAME..."
            echo "Imagem: $IMAGE"

            docker service update \
              --detach \
              --with-registry-auth \
              --update-order stop-first \
              --limit-memory 512M \
              --reserve-memory 128M \
              --image "$IMAGE" \
              --force \
              "$SERVICE_NAME"

            echo "Atualização iniciada."
            echo "Aguardando convergência do frontend..."

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              REPLICAS=$(docker service ls \
                --filter "name=$SERVICE_NAME" \
                --format '{{.Replicas}}')

              UPDATE_STATE=$(docker service inspect "$SERVICE_NAME" \
                --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}unknown{{end}}')

              echo "Tentativa $attempt/$MAX_ATTEMPTS"
              echo "Réplicas: $REPLICAS"
              echo "Estado da atualização: $UPDATE_STATE"

              if [ "$REPLICAS" = "$EXPECTED_REPLICAS" ] && \
                 { [ "$UPDATE_STATE" = "completed" ] || [ "$UPDATE_STATE" = "unknown" ]; }; then
                echo "Frontend convergiu com sucesso."
                docker service inspect "$SERVICE_NAME" \
                  --format 'Update order: {{.Spec.UpdateConfig.Order}}; memory limit: {{.Spec.TaskTemplate.Resources.Limits.MemoryBytes}} bytes; memory reservation: {{.Spec.TaskTemplate.Resources.Reservations.MemoryBytes}} bytes'

                docker service ps "$SERVICE_NAME" --no-trunc
                break
              fi

              if [ "$UPDATE_STATE" = "paused" ] ||
                 [ "$UPDATE_STATE" = "rollback_started" ] ||
                 [ "$UPDATE_STATE" = "rollback_paused" ] ||
                 [ "$UPDATE_STATE" = "rollback_completed" ]; then
                echo "ERRO: atualização interrompida ou revertida pelo Docker Swarm."
                docker service inspect "$SERVICE_NAME" \
                  --format 'Mensagem do Swarm: {{if .UpdateStatus}}{{.UpdateStatus.Message}}{{else}}indisponível{{end}}'
                docker service ps "$SERVICE_NAME" --no-trunc
                docker service logs "$SERVICE_NAME" --since 15m --tail 150 || true
                exit 1
              fi

              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "ERRO: frontend não convergiu para $EXPECTED_REPLICAS após $((MAX_ATTEMPTS * RETRY_INTERVAL_SECONDS)) segundos."
                docker service inspect "$SERVICE_NAME" \
                  --format 'Mensagem do Swarm: {{if .UpdateStatus}}{{.UpdateStatus.Message}}{{else}}indisponível{{end}}'
                docker service ps "$SERVICE_NAME" --no-trunc
                docker service logs "$SERVICE_NAME" --since 15m --tail 150 || true
                exit 1
              fi

              sleep "$RETRY_INTERVAL_SECONDS"
            done

            RUNNER_SERVICE="sisag_scheduling-automation-runner"
            if docker service inspect "$RUNNER_SERVICE" >/dev/null 2>&1; then
              docker service update --detach --with-registry-auth --image "$IMAGE" --force "$RUNNER_SERVICE"
            else
              docker service create --detach --name "$RUNNER_SERVICE" --replicas 1 --restart-condition any --restart-delay 5s --network sisag_sisag-net --secret source=sisag_internal_secret_v4,target=sisag_internal_secret --env SISAG_INTERNAL_SECRET_FILE=/run/secrets/sisag_internal_secret --env SISAG_AUTOMATION_BASE_URL=http://app-frontend:3000 --env SISAG_AUTOMATION_INTERVAL_MS=60000 --limit-memory 192M --reserve-memory 64M --with-registry-auth "$IMAGE" node /app/scheduling-automation-runner.mjs
            fi

            for attempt in $(seq 1 30); do
              RUNNER_REPLICAS=$(docker service ls --filter "name=$RUNNER_SERVICE" --format '{{.Replicas}}')
              echo "Runner: $RUNNER_REPLICAS"
              [ "$RUNNER_REPLICAS" = "1/1" ] && docker service logs "$RUNNER_SERVICE" --since 2m --tail 20 && exit 0
              sleep 5
            done
            docker service ps "$RUNNER_SERVICE" --no-trunc
            docker service logs "$RUNNER_SERVICE" --since 10m --tail 100 || true
            exit 1
