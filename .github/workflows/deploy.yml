name: Build & Deploy (Swarm)

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "drizzle/**"
      - "migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "Dockerfile.outbox-dispatcher"
      - "Dockerfile.whatsapp-worker"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 1) APP (Next.js)
      # ==========================================================
      - name: Build & push APP image
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sisag-app:latest
            ghcr.io/${{ env.OWNER_LC }}/sisag-app:${{ github.sha }}

      # ==========================================================
      # 2) OUTBOX DISPATCHER
      # ==========================================================
      - name: Build & push OUTBOX DISPATCHER image
        id: build_dispatcher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.outbox-dispatcher
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sisag-outbox-dispatcher:latest
            ghcr.io/${{ env.OWNER_LC }}/sisag-outbox-dispatcher:${{ github.sha }}

      - name: Smoke test DISPATCHER image (must NOT contain @/)
        run: |
          set -e
          docker pull ghcr.io/${{ env.OWNER_LC }}/sisag-outbox-dispatcher:latest
          docker run --rm --entrypoint sh ghcr.io/${{ env.OWNER_LC }}/sisag-outbox-dispatcher:latest -lc \
            'echo "=== top of /app/outbox-dispatcher.js ==="; head -n 40 /app/outbox-dispatcher.js; echo; \
             if grep -n "@/modules" /app/outbox-dispatcher.js; then echo "ERROR: dispatcher still contains @/modules"; exit 1; fi; \
             echo "OK: dispatcher has no @/modules"'

      # ==========================================================
      # 3) WHATSAPP WORKER
      # ==========================================================
      - name: Build & push WHATSAPP WORKER image
        id: build_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.whatsapp-worker
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sisag-whatsapp-worker:latest
            ghcr.io/${{ env.OWNER_LC }}/sisag-whatsapp-worker:${{ github.sha }}

      # ==========================================================
      # Deploy no Swarm (sem docker pull -> evita timeout)
      # ==========================================================
      - name: Deploy to Swarm via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}

          # 🔧 evita "Run Command Timeout" em pulls longos / rede lenta
          timeout: 30m
          command_timeout: 30m

          script: |
            set -e
            echo "Updating services (Swarm will pull on nodes)..."

            docker service update --with-registry-auth \
              --image ghcr.io/${{ env.OWNER_LC }}/sisag-app:latest \
              --force sisag_app-frontend

            docker service update --with-registry-auth \
              --image ghcr.io/${{ env.OWNER_LC }}/sisag-outbox-dispatcher:latest \
              --force sisag_outbox-dispatcher

            docker service update --with-registry-auth \
              --image ghcr.io/${{ env.OWNER_LC }}/sisag-whatsapp-worker:latest \
              --force sisag_whatsapp-worker

            echo "Done."
