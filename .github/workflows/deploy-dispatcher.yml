// src/workers/outbox-dispatcher.js
const fs = require("fs");
const crypto = require("crypto");
const { Pool } = require("pg");

function readSecret(path) {
  if (!path) return undefined;
  try {
    return fs.readFileSync(path, "utf8").trim();
  } catch {
    return undefined;
  }
}

function env(name, def) {
  return process.env[name] ?? def;
}

function toInt(v, def) {
  const n = parseInt(String(v ?? ""), 10);
  return Number.isFinite(n) ? n : def;
}

function short(str, max = 900) {
  if (!str) return "";
  const s = String(str);
  return s.length <= max ? s : s.slice(0, max) + "...";
}

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

function signHmac(secret, ts, bodyStr) {
  return (
    "sha256=" +
    crypto.createHmac("sha256", secret).update(`${ts}.${bodyStr}`).digest("hex")
  );
}

async function fetchWithTimeout(url, bodyStr, headers, timeoutMs) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers,
      body: bodyStr,
      signal: ac.signal,
    });
    const text = await res.text().catch(() => "");
    return { ok: res.ok, status: res.status, text };
  } finally {
    clearTimeout(t);
  }
}

async function main() {
  const dbUrl =
    readSecret(process.env.DATABASE_URL_FILE) || process.env.DATABASE_URL;

  if (!dbUrl) {
    console.error("[DISPATCHER] missing DATABASE_URL or DATABASE_URL_FILE");
    process.exit(1);
  }

  const webhookUrl = process.env.N8N_WEBHOOK_URL;
  if (!webhookUrl) {
    console.error("[DISPATCHER] missing N8N_WEBHOOK_URL");
    process.exit(1);
  }

  // configs
  const batchSize = toInt(env("DISPATCH_BATCH_SIZE", "10"), 10);
  const intervalMs = toInt(env("DISPATCH_INTERVAL_MS", "2000"), 2000);
  const timeoutMs = toInt(env("N8N_TIMEOUT_MS", "8000"), 8000);
  const secret = env("N8N_WEBHOOK_SECRET", ""); // usado para HMAC e (temporário) fallback

  const pool = new Pool({
    connectionString: dbUrl,
    // supabase/pooler pode exigir ssl; manter permissivo aqui
    ssl: { rejectUnauthorized: false },
  });

  console.log("[DISPATCHER] started v2-cycle", {
    batchSize,
    intervalMs,
    timeoutMs,
    webhookUrl,
    hasSecret: !!secret,
  });

  while (true) {
    const cycleStarted = Date.now();
    let claimed = 0;
    let sent = 0;
    let failed = 0;

    const client = await pool.connect();
    try {
      const { rows } = await client.query(
        `
        with picked as (
          select id
          from public.outbox
          where
            status = 'pending'
            or (status = 'retrying' and (next_retry_at is null or next_retry_at < now()))
          order by created_at asc
          limit $1
          for update skip locked
        )
        update public.outbox o
        set status = 'processing',
            updated_at = now()
        from picked
        where o.id = picked.id
        returning o.*;
        `,
        [batchSize]
      );

      claimed = rows.length;

      if (!rows.length) {
        client.release();
        await sleep(intervalMs);
        continue;
      }

      console.log("[DISPATCHER] claimed", claimed);

      for (const evt of rows) {
        try {
          const payload = {
            id: evt.id,
            aggregateType: evt.aggregate_type,
            aggregateId: evt.aggregate_id,
            eventType: evt.event_type,
            payload: evt.payload,
            attempts: evt.attempts ?? 0,
            createdAt: evt.created_at,
          };

          const bodyStr = JSON.stringify(payload);

          const headers = { "content-type": "application/json" };

          // ✅ HMAC (novo)
          if (secret) {
            const ts = Math.floor(Date.now() / 1000).toString();
            headers["x-sisag-ts"] = ts;
            headers["x-sisag-signature"] = signHmac(secret, ts, bodyStr);

            // ✅ fallback temporário (remover depois que n8n validar HMAC 100%)
            headers["x-sisag-secret"] = secret;
          }

          const r = await fetchWithTimeout(
            webhookUrl,
            bodyStr,
            headers,
            timeoutMs
          );

          if (!r.ok) {
            throw new Error(`status=${r.status} body=${short(r.text)}`);
          }

          await client.query(
            `
            update public.outbox
            set status='sent',
                last_error=null,
                next_retry_at=null,
                updated_at=now()
            where id=$1
            `,
            [evt.id]
          );

          sent++;
        } catch (e) {
          failed++;

          const attempts = (evt.attempts ?? 0) + 1;
          const nextRetry = new Date(Date.now() + 5 * 60000);

          await client.query(
            `
            update public.outbox
            set status = $2,
                attempts = $3,
                last_error = $4,
                next_retry_at = $5,
                updated_at = now()
            where id=$1
            `,
            [
              evt.id,
              attempts >= 10 ? "dead" : "retrying",
              attempts,
              short(e?.message ?? e),
              nextRetry,
            ]
          );
        }
      }
    } catch (e) {
      console.error("[DISPATCHER] loop error", short(e?.message ?? e));
      await sleep(2000);
    } finally {
      try {
        client.release();
      } catch {}
    }

    const ms = Date.now() - cycleStarted;
    console.log("[DISPATCHER] cycle", { claimed, sent, failed, ms });
    await sleep(intervalMs);
  }
}

main().catch((e) => {
  console.error("[DISPATCHER] fatal", short(e?.message ?? e));
  process.exit(1);
});
