name: Build & Push - WhatsApp Worker

on:
  push:
    branches: ["main"]
    paths:
      - "src/services/sisag-whatsapp-worker/**"
      - ".github/workflows/whatsapp-worker.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/services/sisag-whatsapp-worker
          file: ./src/services/sisag-whatsapp-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/flaience/sisag-whatsapp-worker:latest
            ghcr.io/flaience/sisag-whatsapp-worker:${{ github.sha }}
