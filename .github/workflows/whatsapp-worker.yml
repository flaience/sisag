name: Build & Push - WhatsApp Worker

on:
  push:
    branches: ["main"]
    paths:
      - "src/services/sisag-whatsapp-worker/**"
      - ".github/workflows/whatsapp-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Retry de login (mitiga timeout do ghcr.io/token)
      - name: Login to GHCR (retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && exit 0
            sleep 5
          done
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/services/sisag-whatsapp-worker
          file: ./src/services/sisag-whatsapp-worker/Dockerfile
          push: true
          # (Opcional) reduz metadados e possíveis falhas
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/sisag-whatsapp-worker:latest
            ghcr.io/${{ github.repository_owner }}/sisag-whatsapp-worker:${{ github.sha }}
