name: Deploy Outbox Dispatcher

on:
  push:
    branches: [main, master]
    paths:
      - "workers/**"

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -f workers/Dockerfile.outbox-dispatcher -t ghcr.io/flaience/sisag-outbox-dispatcher:latest .

      - name: Push image
        run: docker push ghcr.io/flaience/sisag-outbox-dispatcher:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/flaience/sisag-outbox-dispatcher:latest
            docker stack deploy -c /opt/sisag/stack.yml sisag
