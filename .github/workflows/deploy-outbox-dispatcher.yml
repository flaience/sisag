name: Deploy Outbox Dispatcher

on:
  push:
    branches: [main, master]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-outbox-dispatcher.yml"

permissions:
  contents: read
  packages: write

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Login robusto (com retry) usando GITHUB_TOKEN
      - name: Login GHCR (retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && exit 0
            sleep 5
          done
          exit 1

      - name: Build image
        run: |
          docker build -f workers/Dockerfile.outbox-dispatcher \
            -t ghcr.io/${{ github.repository_owner }}/sisag-outbox-dispatcher:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sisag-outbox-dispatcher:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            docker pull ghcr.io/${{ github.repository_owner }}/sisag-outbox-dispatcher:latest
            docker service update --force sisag_outbox-dispatcher || true
            docker stack deploy -c /opt/sisag/stack.yml sisag
